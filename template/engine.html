<!doctype html>
<html><head><meta charset="utf-8">
<!--BASE-->
<style>
/*FONTS*/
:root{
  --bg1:#0B1026; --bg2:#1B1F4B; --primary:#5B6CFF; --accent:#22D3EE; --hl:#FBBF24;
  --text:#FFFFFF; --muted:#C7D2FE; --ink:#111827; --ink-muted:#4B5563;
  --font:'Poppins',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg1)}
body{font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased}
.mi{font-family:'Material Icons';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga'}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
#grid{position:absolute;inset:-60px;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(70% 70% at 50% 45%,#000 30%,transparent 100%)}
#logo{position:absolute;left:84px;top:56px;height:38px;z-index:50;display:flex;align-items:center;color:#fff;font-size:30px;font-weight:600}
#logo img,#logo svg{height:100%;width:auto}
#tag{position:absolute;right:84px;top:64px;font-size:16px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted);z-index:50}
#tag b{color:var(--accent);font-weight:600}
#cap{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);max-width:1500px;text-align:center;z-index:60;font-size:33px;line-height:1.35;font-weight:500;padding:12px 30px;border-radius:14px;background:rgba(2,6,23,.8);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12)}
#cap:empty{display:none}
#prog{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--primary),var(--accent));z-index:61;box-shadow:0 0 14px var(--accent)}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.eyebrow{font-size:20px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
.h1{font-size:76px;font-weight:600;line-height:1.1}
.h2{font-size:56px;font-weight:600;line-height:1.15}
.grad{background:linear-gradient(90deg,#fff 0%,var(--muted) 40%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:26px;line-height:1.45;color:var(--muted)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);border-radius:24px;box-shadow:0 30px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.shot{position:absolute;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 50px 100px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.3),0 0 80px color-mix(in srgb,var(--accent) 25%,transparent)}
.shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.ring{position:absolute;border:4px solid var(--accent);border-radius:14px;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent),0 0 40px var(--accent);opacity:0}
.chip{display:inline-flex;align-items:center;gap:12px;padding:14px 24px;border-radius:999px;font-size:24px;font-weight:500;background:color-mix(in srgb,var(--primary) 30%,transparent);border:1px solid color-mix(in srgb,var(--primary) 70%,white);color:#fff;white-space:nowrap}
.chip .mi{font-size:28px;color:var(--accent)}
.tile{width:84px;height:84px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.tile img{width:62%;height:62%;object-fit:contain}
.ib{width:84px;height:84px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 35%,transparent)}
.ib .mi{font-size:46px;color:#fff}
.item{position:absolute;display:flex;gap:24px;align-items:center;padding:24px 28px}
.item .t{font-size:32px;font-weight:600;line-height:1.15}
.item .d{font-size:21px;color:var(--muted);margin-top:4px;line-height:1.35}
.gcard{position:absolute;padding:36px;display:flex;flex-direction:column;gap:18px}
.gcard .t{font-size:34px;font-weight:600}
.gcard .d{font-size:22px;color:var(--muted);line-height:1.4}
.col{position:absolute;padding:28px}
.col .hd{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:600;margin-bottom:26px}
.col .hd .tile{width:52px;height:52px;border-radius:12px}
.ln{height:14px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.45),rgba(255,255,255,.15));margin:16px 0;transform-origin:left}
.badge{position:absolute;padding:10px 20px;border-radius:999px;background:var(--accent);color:var(--bg1);font-size:20px;font-weight:600;display:flex;gap:8px;align-items:center}
.plan{position:absolute;background:#fff;border-radius:26px;color:var(--ink);padding:44px;box-shadow:0 50px 100px rgba(0,0,0,.5)}
.plan .pn{font-size:30px;font-weight:600}
.plan .pd{font-size:19px;color:var(--ink-muted);margin-top:8px;line-height:1.45;min-height:56px}
.plan .pr{font-size:64px;font-weight:600;margin-top:20px}
.plan .pr small{font-size:26px;font-weight:500;color:var(--ink-muted)}
.plan ul{list-style:none;margin-top:16px}
.plan li{font-size:21px;margin:10px 0;display:flex;gap:12px;align-items:center}
.plan li .mi{color:var(--primary);font-size:26px}
.plan .cta{position:absolute;left:44px;right:44px;bottom:40px;height:62px;border-radius:10px;background:var(--primary);color:#fff;font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center}
.plan .rib{position:absolute;top:-18px;right:36px;padding:8px 18px;border-radius:999px;background:var(--bg1);color:var(--accent);font-size:16px;font-weight:600;letter-spacing:1.5px;border:1px solid var(--accent);text-transform:uppercase}
</style></head>
<body><div id="stage">
  <div class="blob" id="b1" style="width:900px;height:900px;left:-200px;top:-300px;background:var(--primary);opacity:.5"></div>
  <div class="blob" id="b2" style="width:700px;height:700px;right:-150px;bottom:-250px;background:var(--accent);opacity:.3"></div>
  <div class="blob" id="b3" style="width:600px;height:600px;left:700px;top:500px;background:var(--primary);opacity:.25"></div>
  <div id="grid"></div>
  <div id="logo"></div><div id="tag"></div>
  <div id="scenes"></div>
  <div id="cap"></div><div id="prog"></div>
</div>
<script>
const CFG=/*CONFIG*/;
const V=CFG.video, TL=CFG.timeline, LOGO_SVG=CFG.logoSvg||'';
const TOTAL=TL.length?TL[TL.length-1].start+TL[TL.length-1].dur:1;
const E='cubic-bezier(.16,1,.3,1)', IO='cubic-bezier(.65,0,.35,1)', SPRING='cubic-bezier(.34,1.56,.64,1)';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// *word* -> gradient accent
const rich=s=>esc(s).replace(/\*([^*]+)\*/g,'<span class="grad">$1</span>').replace(/\n/g,'<br>');
// Prices: whole amounts never show decimals ($20), others show exactly two ($19.99).
function money(p){ if(p==null)return ''; if(typeof p!=='object')p={amount:p};
  const a=Number(p.amount), whole=Number.isInteger(a);
  const s=new Intl.NumberFormat(p.locale||V.locale||'en-US',{style:'currency',currency:p.currency||V.currency||'USD',minimumFractionDigits:whole?0:2,maximumFractionDigits:whole?0:2}).format(a);
  return {num:s, per:p.period?'/'+p.period:''}; }
const icon=x=>!x?'':(/[\/.]/.test(x)?`<div class="tile"><img src="${esc(x)}"></div>`:`<div class="ib"><span class="mi">${esc(x)}</span></div>`);
function A(el,kf,t0,dur,o={}){ if(!el)return; el.animate(kf,{delay:t0*1000,duration:dur*1000,fill:o.fill||'both',easing:o.ease||E,iterations:o.it||1,direction:o.dir||'normal'}); }
const IN=(el,t,d=.9,dy=40)=>A(el,[{opacity:0,transform:`translateY(${dy}px)`},{opacity:1,transform:'none'}],t,d);
const POP=(el,t)=>A(el,[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}],t,.7,{ease:SPRING});
const OUT=(el,t,d=.45)=>A(el,[{opacity:1},{opacity:0}],t,d,{fill:'forwards',ease:'ease-in'});
const GLOW_ON=[{borderColor:'rgba(255,255,255,.18)',boxShadow:'0 30px 60px rgba(0,0,0,.35)'},{borderColor:'var(--accent)',boxShadow:'0 30px 60px rgba(0,0,0,.35),0 0 40px color-mix(in srgb,var(--accent) 55%,transparent)'}];
// map item i -> line index
function atFor(items,nLines,i,offset=0){ const it=items[i]; if(it&&it.at!=null)return Math.min(it.at,nLines-1);
  const n=items.length, free=nLines-offset; if(n===free)return i+offset; if(n===free-1)return i+offset+1;
  return Math.min(nLines-1,offset+Math.floor(i*free/n)); }
function head(sc,x,y,align='left',w=820){ if(!sc.eyebrow&&!sc.headline)return '';
  return `<div class="abs hd" style="left:${x}px;top:${y}px;width:${w}px;text-align:${align}">${sc.eyebrow?`<div class="eyebrow">${esc(sc.eyebrow)}</div>`:''}${sc.headline?`<div class="h2" style="margin-top:10px">${rich(sc.headline)}</div>`:''}</div>`; }

// ---------- scene builders: each returns html + animate(el,t,c) ----------
const B={
 title(sc){ const p=sc.price?money(sc.price):null;
  return {html:`<div class="abs" id="hero" style="left:260px;right:260px;top:470px;transform:translateY(-50%);text-align:center">
    ${sc.eyebrow?`<div class="eyebrow">${esc(sc.eyebrow)}</div>`:''}
    <div class="h1" style="margin-top:16px">${rich(sc.headline)}</div>
    ${sc.sub?`<div class="sub" style="margin-top:22px">${rich(sc.sub)}</div>`:''}
    ${sc.logos?`<div class="logos" style="display:flex;gap:22px;justify-content:center;margin-top:40px">${sc.logos.map(l=>icon(l)).join('')}</div>`:''}
    ${p?`<div class="price grad" style="margin-top:34px;font-size:84px;font-weight:600;line-height:1">${p.num}<span style="font-size:36px">${p.per}</span></div>`:''}
    ${sc.chip?`<div style="margin-top:34px"><span class="chip"><span class="mi">check_circle</span>${esc(sc.chip)}</span></div>`:''}</div>`,
   animate(el,t,c){ $$('.eyebrow,.h1,.sub',el).forEach((e,i)=>IN(e,t+.15+i*.2));
     $$('.logos .tile',el).forEach((im,i)=>A(im,[{opacity:0,transform:`translate(${(i-1.5)*-200}px,${i%2?-200:200}px) rotate(${(i-1.5)*40}deg)`},{opacity:1,transform:'none'}],t+.5+i*.12,1.2));
     POP($('.price',el),Math.min(c[c.length-1],t+1.4)); const ch=$('.chip',el); if(ch){POP(ch,c.length>1?c[c.length-1]-.1:t+2);} }}; },

 cards(sc){ const items=sc.items||[]; const n=items.length, H=Math.min(190,(760-(n-1)*20)/n);
  return {html:head(sc,110,200,'left',820)+items.map((it,i)=>`<div class="item card ci" style="left:1010px;width:820px;top:${140+i*(H+20)}px;height:${H}px">${icon(it.icon)}<div><div class="t">${esc(it.title)}</div>${it.text?`<div class="d">${esc(it.text)}</div>`:''}</div></div>`).join(''),
   animate(el,t,c){ const hd=$('.hd',el); IN(hd,t+.2); const cs=$$('.ci',el);
     cs.forEach((ci,i)=>{const a=c[atFor(items,c.length,i)]; A(ci,[{opacity:0,transform:'translateX(80px)'},{opacity:1,transform:'none'}],a-.2,.9); A(ci,GLOW_ON,a,.5,{fill:'forwards'});
       const nxt=cs[i+1]?c[atFor(items,c.length,i+1)]:null; if(nxt!=null&&nxt>a) A(ci,[...GLOW_ON].reverse(),nxt,.5,{fill:'forwards'}); }); }}; },

 screenshot(sc){ const items=sc.items||[]; const side=items.length>0; const W=side?1000:1500, Hh=Math.round(W/(sc.aspect||1.5)), Hc=Math.min(Hh,680);
  const left=side?110:(1920-W)/2;
  return {html:head(sc,110,140,'left',1700)+`<div class="shot sh" style="left:${left}px;top:${sc.headline?270:220}px;width:${W}px;height:${Hc}px"><img src="${esc(sc.image)}"></div>`+
   (sc.focus?`<div class="ring" style="left:${left+sc.focus.x*W}px;top:${(sc.headline?270:220)+sc.focus.y*Hh}px;width:${sc.focus.w*W}px;height:${sc.focus.h*Hh}px"></div>`:'')+
   items.map((it,i)=>`<div class="item card ci" style="left:1170px;width:660px;top:${270+i*190}px;height:170px">${icon(it.icon)}<div><div class="t" style="font-size:28px">${esc(it.title)}</div>${it.text?`<div class="d">${esc(it.text)}</div>`:''}</div></div>`).join(''),
   animate(el,t,c){ IN($('.hd',el),t+.1); const sh=$('.sh',el); sh.style.transformOrigin=side?'left center':'center';
     A(sh,[{opacity:0,transform:`perspective(2000px) rotateY(${side?16:0}deg) rotateX(${side?0:12}deg) scale(.9)`},{opacity:1,transform:`perspective(2000px) rotateY(${side?5:0}deg) rotateX(${side?0:4}deg) scale(1)`}],t+.2,1.3);
     if(sc.focus){ const f=sc.focus, at=c[Math.min(f.at||0,c.length-1)]+(f.at?0:1.4), z=f.zoom||1, img=$('img',sh);
       if(z>1){ img.style.transformOrigin=`${(f.x+f.w/2)*100}% ${(f.y+f.h/2)*100}%`; A(img,[{transform:'scale(1)'},{transform:`scale(${z})`}],at,1.8,{ease:IO,fill:'forwards'});
         A(img,[{transform:`scale(${z})`},{transform:'scale(1)'}],t+(sc._dur||8)-2.2,1.4,{ease:IO,fill:'forwards'}); }
       else { const r=$('.ring',el); A(r,[{opacity:0,transform:'scale(1.2)'},{opacity:1,transform:'scale(1)'}],at,.6); OUT(r,t+(sc._dur||8)-1.2,.4); } }
     $$('.ci',el).forEach((ci,i)=>{const a=c[atFor(items,c.length,i)]; A(ci,[{opacity:0,transform:'translateX(80px)'},{opacity:1,transform:'none'}],a-.2,.9);}); }}; },

 grid(sc){ const items=sc.items||[]; const n=items.length, gap=40, W=(1700-(n-1)*gap)/n;
  return {html:head(sc,110,150,'center',1700)+items.map((it,i)=>`<div class="gcard card gi" style="left:${110+i*(W+gap)}px;top:340px;width:${W}px;height:400px">${icon(it.icon)}<div class="t">${esc(it.title)}</div>${it.text?`<div class="d">${esc(it.text)}</div>`:''}</div>`).join(''),
   animate(el,t,c){ IN($('.hd',el),t+.1); $$('.gi',el).forEach((g,i)=>{const a=c[atFor(items,c.length,i)];
     A(g,[{opacity:0,transform:'translateY(70px)'},{opacity:.4,transform:'none'}],t+.3+i*.15,1);
     A(g,[{opacity:.4,borderColor:'rgba(255,255,255,.18)'},{opacity:1,borderColor:'var(--accent)'}],a-.1,.6,{fill:'forwards'});
     A($('.ib,.tile',g),[{transform:'scale(.5) rotate(-25deg)'},{transform:'none'}],a,.8,{ease:SPRING}); }); }}; },

 compare(sc){ const cols=sc.columns||[]; const n=cols.length, gap=60, W=(1620-(n-1)*gap)/n;
  return {html:head(sc,150,150,'center',1620)+cols.map((cl,i)=>`<div class="col card cc" style="left:${150+i*(W+gap)}px;top:340px;width:${W}px;height:440px"><div class="hd">${cl.image?`<div class="tile"><img src="${esc(cl.image)}"></div>`:''}${esc(cl.name)}</div>${[95,80,88,62,75].map(w=>`<div class="ln" style="width:${w}%"></div>`).join('')}</div>`).join('')+
   (sc.pick!=null?`<div class="badge pk" style="left:${150+sc.pick*(W+gap)+W/2-80}px;top:316px"><span class="mi">done</span>${esc(sc.pickLabel||'Best fit')}</div>`:''),
   animate(el,t,c){ IN($('.hd',el),t+.1); const cs=$$('.cc',el); const fill=c[Math.min(1,c.length-1)];
     cs.forEach((cl,i)=>{IN(cl,t+.8+i*.18,.9,60); $$('.ln',cl).forEach((ln,j)=>A(ln,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],fill+.4+i*.25+j*.3,.6,{ease:'ease-out'}));});
     if(sc.pick!=null){const pc=cs[sc.pick], at=fill+3.4; A(pc,GLOW_ON,at,.6,{fill:'forwards'}); A(pc,[{scale:'1'},{scale:'1.04'}],at,.6,{fill:'forwards'}); POP($('.pk',el),at+.2);} }}; },

 pricing(sc){ const pl=sc.plans||[]; const n=pl.length, gap=50, W=Math.min(640,(1700-(n-1)*gap)/n), x0=(1920-(n*W+(n-1)*gap))/2;
  return {html:pl.map((p,i)=>{const m=money(p.price); return `<div class="plan pl" style="left:${x0+i*(W+gap)}px;top:${sc.headline?250:200}px;width:${W}px;height:650px">${p.badge?`<div class="rib">${esc(p.badge)}</div>`:''}
    <div class="pn">${esc(p.name)}</div><div class="pd">${esc(p.desc||'')}</div><div class="pr">${m.num}<small>${m.per}</small></div>
    <ul>${(p.features||[]).slice(0,6).map(f=>`<li><span class="mi">check</span>${esc(f)}</li>`).join('')}</ul><div class="cta">${esc(p.cta||'Get started')}</div></div>`}).join('')+(sc.headline?head(sc,0,120,'center',1920):''),
   animate(el,t,c){ if(sc.headline)IN($('.hd',el),t+.1); $$('.pl',el).forEach((p,i)=>{A(p,[{opacity:0,transform:'perspective(1800px) rotateX(20deg) translateY(120px)'},{opacity:1,transform:'none'}],t+.3+i*.3,1.2);
     $$('li',p).forEach((li,j)=>IN(li,t+1.1+i*.3+j*.15,.6,14));}); }}; },

 end(sc){ return {html:`<div class="abs ec" style="left:0;right:0;top:${sc.url?250:300}px;text-align:center">
    <div class="elogo" style="height:80px;display:flex;justify-content:center;color:#fff;font-size:64px;font-weight:600">${LOGO_SVG||(V.brand&&V.brand.logo?`<img src="${esc(V.brand.logo)}" style="height:100%">`:esc((V.brand||{}).name||''))}</div>
    ${sc.headline?`<div class="h2" style="margin-top:60px">${rich(sc.headline)}</div>`:''}
    ${sc.url?`<div style="margin-top:46px"><span class="chip" style="font-size:30px;padding:18px 34px;background:var(--primary)"><span class="mi" style="color:#fff">language</span>${esc(sc.url)}</span></div>`:''}</div>`,
   animate(el,t,c){ A($('.ec',el),[{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],t+.1,1.2);
     A($('#logo'),[{opacity:1},{opacity:0}],t,.4,{fill:'forwards'}); A($('#tag'),[{opacity:1},{opacity:0}],t,.4,{fill:'forwards'}); }}; },
};

// ---------- assemble ----------
const brand=V.brand||{}; const col=brand.colors||{};
const map={bg1:'--bg1',bg2:'--bg2',primary:'--primary',accent:'--accent',highlight:'--hl',text:'--text',muted:'--muted',ink:'--ink'};
for(const k in col) if(map[k]) document.documentElement.style.setProperty(map[k],col[k]);
if(brand.font) document.documentElement.style.setProperty('--font',`'${brand.font}',system-ui,sans-serif`);
$('#logo').innerHTML=LOGO_SVG||(brand.logo?`<img src="${esc(brand.logo)}">`:esc(brand.name||''));
$('#tag').innerHTML=V.tag?`<b>${esc(V.title||'')}</b>${V.title?' &nbsp;·&nbsp; ':''}${esc(V.tag)}`:'';
A($('#b1'),[{transform:'translate(0,0) scale(1)'},{transform:'translate(260px,140px) scale(1.15)'}],0,14,{it:40,dir:'alternate',ease:IO});
A($('#b2'),[{transform:'translate(0,0)'},{transform:'translate(-300px,-160px)'}],0,11,{it:40,dir:'alternate',ease:IO});
A($('#b3'),[{transform:'translate(0,0)'},{transform:'translate(-420px,-260px)'}],0,17,{it:40,dir:'alternate',ease:IO});
A($('#grid'),[{transform:'translate(0,0)'},{transform:'translate(60px,60px)'}],0,8,{it:80,ease:'linear'});
A($('#logo'),[{opacity:0},{opacity:1}],.1,1); A($('#tag'),[{opacity:0},{opacity:1}],.3,1);
V.scenes.forEach((sc,i)=>{ const tl=TL[i]; sc._dur=tl.dur; const b=(B[sc.type]||B.cards)(sc);
  const el=document.createElement('section'); el.className='scene'; el.id='s'+i; el.innerHTML=b.html; $('#scenes').appendChild(el);
  A(el,[{opacity:0},{opacity:1}],tl.start,.55,{ease:'ease-out'}); if(i<V.scenes.length-1) OUT(el,tl.start+tl.dur-.45,.45);
  b.animate(el,tl.start,tl.caps.map(x=>x.start)); });
const caps=TL.flatMap(s=>s.caps), CLEAN=location.search.includes('clean');
window.setTime=T=>{ document.getAnimations().forEach(a=>{a.pause();a.currentTime=T*1000;});
  const cp=CLEAN?null:caps.find(c=>T>=c.start-.05&&T<c.end+.15); $('#cap').textContent=cp?cp.show:''; $('#prog').style.width=(CLEAN?0:100*T/TOTAL)+'%'; };
window.TOTAL=TOTAL;
</script></body></html>
